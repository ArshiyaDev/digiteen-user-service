services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-digiteen_users}
      POSTGRES_USER: ${POSTGRES_USER:-digiteen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-digiteen_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - user_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  user_postgres_data:
